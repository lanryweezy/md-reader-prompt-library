appId: com.mdreader.desktop
productName: MD Reader
copyright: Copyright © 2026 MD Reader

directories:
  output: release/${version}
  buildResources: build

files:
  - dist/**/*
  - electron/**/*
  - package.json

# Registers MD Reader as a native handler for Markdown files on Windows, macOS, and Linux
fileAssociations:
  - ext:
      - md
      - markdown
      - mdx
      - mdown
      - mkd
    name: Markdown Document
    description: Markdown Document
    role: Editor
    mimeType: text/markdown

mac:
  category: public.app-category.productivity
  artifactName: MD-Reader-macOS-${arch}.${ext}
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  artifactName: MD-Reader-Setup-Windows-${arch}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: MD Reader

portable:
  artifactName: MD-Reader-Portable-Windows-${arch}.${ext}

linux:
  category: Office
  mimeTypes:
    - text/markdown
    - text/x-markdown
  artifactName: MD-Reader-Linux-${arch}.${ext}
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
